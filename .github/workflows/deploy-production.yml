name: Deploy NFL Platform to Production

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - staging
          - production
      force_deploy:
        description: 'Force deployment (skip tests)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !inputs.force_deploy }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install uv
        run: pip install uv
        
      - name: Install dependencies
        run: uv sync --dev
        
      - name: Run linting
        run: uv run ruff check .
        
      - name: Run formatting check
        run: uv run ruff format --check .
        
      - name: Run tests
        run: uv run pytest tests/ --cov=src --cov-report=xml
        
      - name: Run Phase 3 validation
        run: uv run python scripts/test_phase3.py
        
      - name: Test dbt compilation
        run: |
          cd dbt
          uv run dbt deps
          uv run dbt compile
          
      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml

  build:
    runs-on: ubuntu-latest
    needs: test
    if: always() && (needs.test.result == 'success' || inputs.force_deploy)
    
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            
      - name: Build and push Docker images
        id: build
        run: |
          # Build all component images
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/extractor:${{ github.sha }} \
            --file docker/nfl-extractor/Dockerfile \
            --push .
            
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dbt-runner:${{ github.sha }} \
            --file docker/dbt-runner/Dockerfile \
            --push .
            
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/dagster-server:${{ github.sha }} \
            --file docker/dagster-server/Dockerfile \
            --push .
            
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/postgres-ducklake:${{ github.sha }} \
            --file docker/postgres-ducklake/Dockerfile \
            --push .

  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Ansible
        run: |
          pip install ansible ansible-core
          ansible-galaxy collection install community.docker
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts
          
      - name: Deploy to staging
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-playbook -i inventories/staging/hosts.yml \
            playbooks/deploy-nfl-platform.yml \
            --extra-vars "nfl_platform_version=${{ github.sha }}" \
            --vault-password-file .vault_pass
            
      - name: Run staging tests
        run: |
          # Wait for deployment to be ready
          sleep 60
          
          # Run basic health checks
          curl -f https://staging.nfl-platform.example.com/health
          curl -f https://staging.nfl-platform.example.com/dagster/
          
      - name: Notify deployment
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: "NFL Platform deployed to staging: ${{ github.sha }}"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]
    if: github.ref == 'refs/heads/main' && inputs.environment == 'production'
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Ansible
        run: |
          pip install ansible ansible-core
          ansible-galaxy collection install community.docker
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for host in ${{ secrets.PRODUCTION_HOSTS }}; do
            ssh-keyscan -H $host >> ~/.ssh/known_hosts
          done
          
      - name: Deploy to production
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-playbook -i inventories/production/hosts.yml \
            playbooks/deploy-nfl-platform.yml \
            --extra-vars "nfl_platform_version=${{ github.sha }}" \
            --vault-password-file .vault_pass \
            --limit nfl_app_servers
            
      - name: Run production health checks
        run: |
          # Wait for deployment to be ready
          sleep 120
          
          # Run comprehensive health checks
          ./scripts/production-health-check.sh
          
      - name: Update monitoring
        run: |
          # Update deployment tracking in monitoring
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.GRAFANA_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"text": "Production deployment: ${{ github.sha }}", "tags": ["deployment", "production"]}' \
            https://grafana.nfl-platform.example.com/api/annotations
            
      - name: Notify deployment success
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            🚀 NFL Platform successfully deployed to production!
            
            **Version:** ${{ github.sha }}
            **Deployed by:** ${{ github.actor }}
            **Branch:** ${{ github.ref_name }}
            **Commit:** ${{ github.event.head_commit.message }}
            
            **Access URLs:**
            • Dashboard: https://nfl-platform.example.com/dagster/
            • Monitoring: https://nfl-platform.example.com/grafana/
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: Notify deployment failure
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: |
            ❌ NFL Platform deployment to production FAILED!
            
            **Version:** ${{ github.sha }}
            **Failed step:** ${{ job.status }}
            **Actor:** ${{ github.actor }}
            
            Please check the deployment logs and rollback if necessary.
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  rollback:
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: deploy-production
    environment: production
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Ansible
        run: |
          pip install ansible ansible-core
          ansible-galaxy collection install community.docker
          
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PRODUCTION_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          for host in ${{ secrets.PRODUCTION_HOSTS }}; do
            ssh-keyscan -H $host >> ~/.ssh/known_hosts
          done
          
      - name: Rollback deployment
        run: |
          cd ansible
          echo "${{ secrets.ANSIBLE_VAULT_PASSWORD }}" > .vault_pass
          ansible-playbook -i inventories/production/hosts.yml \
            playbooks/rollback-nfl-platform.yml \
            --vault-password-file .vault_pass
            
      - name: Notify rollback
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            🔄 NFL Platform rollback initiated due to deployment failure.
            **Status:** ${{ job.status }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}