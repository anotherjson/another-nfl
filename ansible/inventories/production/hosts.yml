---
# NFL Platform Production Inventory

all:
  children:
    nfl_platform:
      children:
        nfl_app_servers:
          hosts:
            nfl-app-01:
              ansible_host: "{{ vault_nfl_app_01_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              server_role: primary
              
            nfl-app-02:
              ansible_host: "{{ vault_nfl_app_02_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              server_role: secondary
              
            nfl-app-03:
              ansible_host: "{{ vault_nfl_app_03_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              server_role: secondary
              
        nfl_db_servers:
          hosts:
            nfl-db-01:
              ansible_host: "{{ vault_nfl_db_01_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              postgres_role: primary
              
            nfl-db-02:
              ansible_host: "{{ vault_nfl_db_02_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              postgres_role: replica
              
        nfl_load_balancers:
          hosts:
            nfl-lb-01:
              ansible_host: "{{ vault_nfl_lb_01_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"
              
        nfl_monitoring:
          hosts:
            nfl-monitor-01:
              ansible_host: "{{ vault_nfl_monitor_01_ip }}"
              ansible_user: "{{ vault_ansible_user }}"
              ansible_ssh_private_key_file: "{{ vault_ssh_key_path }}"

  vars:
    # Common variables for all hosts
    ansible_python_interpreter: /usr/bin/python3
    nfl_platform_version: "{{ vault_nfl_platform_version | default('latest') }}"
    deployment_environment: production
    
    # Docker configuration
    docker_edition: ce
    docker_package: docker-{{ docker_edition }}
    docker_compose_version: "2.21.0"
    
    # Application configuration
    nfl_app_user: nfl-user
    nfl_app_group: nfl-group
    nfl_data_path: /opt/nfl-data
    nfl_logs_path: /opt/nfl-logs
    nfl_config_path: /opt/nfl-config
    
    # Network configuration
    nfl_network_subnet: "172.20.0.0/16"
    
    # Backup configuration
    backup_retention_days: 30
    backup_schedule: "0 2 * * *"  # Daily at 2 AM