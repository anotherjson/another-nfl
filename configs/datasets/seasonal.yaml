# Seasonal player statistics configuration
name: seasonal
description: "Seasonal aggregated player statistics"
function_name: import_seasonal_data
start_year: 1999
requires_year: true
data_type: player_seasonal
partition_by: year
validation:
  required_columns:
    - player_id
    - player_name
    - season
  expected_size_mb: 20
extraction:
  chunk_size: 1000
  timeout_seconds: 120
  retry_attempts: 3
output:
  file_format: parquet
  compression: snappy
  path_template: "data/{dataset}/{year}/etl_date={etl_date}/data.parquet"