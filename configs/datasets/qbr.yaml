# Weekly QBR data configuration
name: qbr
description: "Weekly QB rating (QBR) data"
function_name: import_qbr
start_year: 2006
requires_year: true
data_type: qb_rating
partition_by: year
validation:
  required_columns:
    - player_id
    - season
    - week
  expected_size_mb: 15
extraction:
  chunk_size: 1000
  timeout_seconds: 120
  retry_attempts: 3
output:
  file_format: parquet
  compression: snappy
  path_template: "data/{dataset}/{year}/etl_date={etl_date}/data.parquet"