# Weekly team rosters configuration
name: weekly_rosters
description: "Weekly team roster information"
function_name: import_weekly_rosters
start_year: 1999
requires_year: true
data_type: roster_weekly
partition_by: year
validation:
  required_columns:
    - player_id
    - team
    - week
    - season
  expected_size_mb: 30
extraction:
  chunk_size: 1000
  timeout_seconds: 120
  retry_attempts: 3
output:
  file_format: parquet
  compression: snappy
  path_template: "data/{dataset}/{year}/etl_date={etl_date}/data.parquet"