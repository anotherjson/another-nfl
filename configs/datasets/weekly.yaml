# Weekly player statistics configuration
name: weekly
description: "Weekly player statistics and performance data"
function_name: import_weekly_data
start_year: 1999
requires_year: true
data_type: player_weekly
partition_by: year
validation:
  required_columns:
    - player_id
    - player_name
    - week
    - season
  expected_size_mb: 50
extraction:
  chunk_size: 1000
  timeout_seconds: 180
  retry_attempts: 3
output:
  file_format: parquet
  compression: snappy
  path_template: "data/{dataset}/{year}/etl_date={etl_date}/data.parquet"