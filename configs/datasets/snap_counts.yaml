# Player snap counts configuration
name: snap_counts
description: "Player snap counts and participation data"
function_name: import_snap_counts
start_year: 2012
requires_year: true
data_type: snap_counts
partition_by: year
validation:
  required_columns:
    - player_id
    - season
    - week
  expected_size_mb: 30
extraction:
  chunk_size: 1000
  timeout_seconds: 150
  retry_attempts: 3
output:
  file_format: parquet
  compression: snappy
  path_template: "data/{dataset}/{year}/etl_date={etl_date}/data.parquet"