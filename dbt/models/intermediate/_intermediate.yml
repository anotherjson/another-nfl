# _intermediate.yml - Intermediate model configurations

version: 2

models:
  - name: int_team_performance
    description: "Enhanced team performance metrics aggregated by season and week with advanced analytics"
    config:
      tags: ["intermediate", "team_performance"]
    columns:
      - name: team_id
        description: "Team abbreviation" 
        tests:
          - not_null
          - relationships:
              to: ref('stg_team_desc')
              field: team_id
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      - name: week
        description: "Week number within the season"
        tests:
          - not_null
      - name: total_plays
        description: "Total offensive plays"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 150
      - name: avg_epa
        description: "Average expected points added per play"
        tests:
          - not_null
      - name: third_down_conversion_rate
        description: "Third down conversion percentage"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: win_percentage
        description: "Win percentage for the season through this week"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
          
  - name: int_player_weekly_stats
    description: "Enhanced weekly player statistics with advanced position-specific metrics and EPA analytics"
    config:
      tags: ["intermediate", "player_stats"]
    columns:
      - name: player_id
        description: "Unique identifier for each player"
        tests:
          - not_null
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      - name: week
        description: "Week number within the season"
        tests:
          - not_null
      - name: team
        description: "Player's team"
        tests:
          - relationships:
              to: ref('stg_team_desc')
              field: team_id
      - name: fantasy_points_ppr
        description: "Fantasy points in PPR scoring"
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 60
      - name: fantasy_points_ppr_4wk_avg
        description: "4-week rolling average of PPR fantasy points"
        tests:
          - dbt_utils.accepted_range:
              min_value: -5
              max_value: 50
      - name: catch_rate
        description: "Percentage of targets resulting in receptions"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: completion_percentage
        description: "Percentage of pass attempts completed"
        tests:
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 1
      - name: receiving_epa_per_target
        description: "Expected points added per receiving target"
      - name: rushing_epa_per_carry
        description: "Expected points added per rushing attempt"
      - name: passing_epa_per_attempt
        description: "Expected points added per passing attempt"