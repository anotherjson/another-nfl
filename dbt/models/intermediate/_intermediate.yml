# _intermediate.yml - Intermediate model configurations

version: 2

models:
  - name: int_team_performance
    description: "Team performance metrics aggregated by season and week"
    config:
      tags: ["intermediate", "team_performance"]
    columns:
      - name: team_id
        description: "Team abbreviation" 
        tests:
          - not_null
          - relationships:
              to: ref('stg_team_desc')
              field: team_id
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      - name: week
        description: "Week number within the season"
        tests:
          - not_null
      - name: total_plays
        description: "Total offensive plays"
        tests:
          - not_null
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 150
      - name: avg_epa
        description: "Average expected points added per play"
        tests:
          - not_null
          
  - name: int_player_weekly_stats
    description: "Weekly player statistics with position-specific metrics"
    config:
      tags: ["intermediate", "player_stats"]
    columns:
      - name: player_id
        description: "Unique identifier for each player"
        tests:
          - not_null
      - name: season
        description: "NFL season year"
        tests:
          - not_null
      - name: week
        description: "Week number within the season"
        tests:
          - not_null
      - name: team
        description: "Player's team"
        tests:
          - relationships:
              to: ref('stg_team_desc')
              field: team_id
      - name: fantasy_points_ppr
        description: "Fantasy points in PPR scoring"
        tests:
          - dbt_utils.accepted_range:
              min_value: -10
              max_value: 60