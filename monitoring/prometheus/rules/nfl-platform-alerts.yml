# NFL Platform Alerting Rules

groups:
  - name: nfl-platform-infrastructure
    rules:
      # High-level service availability
      - alert: ServiceDown
        expr: up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} on {{ $labels.instance }} is down"
          description: "Service {{ $labels.job }} on {{ $labels.instance }} has been down for more than 5 minutes."

      # System resource alerts
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for more than 10 minutes on {{ $labels.instance }}"

      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for more than 10 minutes on {{ $labels.instance }}"

      - alert: DiskSpaceRunningOut
        expr: (node_filesystem_avail_bytes{fstype!="tmpfs"} / node_filesystem_size_bytes{fstype!="tmpfs"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk space running out on {{ $labels.instance }}"
          description: "Disk space is below 15% on {{ $labels.instance }} ({{ $labels.mountpoint }})"

  - name: nfl-platform-application
    rules:
      # Database alerts
      - alert: PostgreSQLDown
        expr: pg_up == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "PostgreSQL database is down on {{ $labels.instance }}"
          description: "PostgreSQL database has been down for more than 5 minutes"

      - alert: PostgreSQLTooManyConnections
        expr: sum by (instance) (pg_stat_activity_count) > 180
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "PostgreSQL has too many connections on {{ $labels.instance }}"
          description: "PostgreSQL has more than 180 active connections"

      # Container alerts
      - alert: ContainerDown
        expr: absent(container_last_seen{name=~"nfl-.*"})
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.name }} is down"
          description: "NFL platform container {{ $labels.name }} has been down for more than 5 minutes"

      - alert: ContainerHighMemoryUsage
        expr: (container_memory_usage_bytes{name=~"nfl-.*"} / container_spec_memory_limit_bytes{name=~"nfl-.*"}) * 100 > 90
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.name }} high memory usage"
          description: "Container {{ $labels.name }} memory usage is above 90%"

  - name: nfl-platform-business
    rules:
      # NFL data pipeline specific alerts
      - alert: NFLDataExtractionFailed
        expr: increase(nfl_extraction_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "NFL data extraction failed"
          description: "NFL data extraction has failed {{ $value }} times in the last hour"

      - alert: NFLDataStale
        expr: time() - nfl_last_successful_extraction_timestamp > 86400  # 24 hours
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "NFL data is stale"
          description: "NFL data hasn't been updated for more than 24 hours"

      - alert: DbtModelsFailed
        expr: increase(dbt_model_failures_total[1h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "dbt models failed"
          description: "{{ $value }} dbt models have failed in the last hour"

      - alert: DagsterPipelineFailed
        expr: increase(dagster_pipeline_failures_total[4h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Dagster pipeline failed"
          description: "Dagster pipeline has failed {{ $value }} times in the last 4 hours"

      # Data quality alerts
      - alert: NFLDataQualityIssue
        expr: nfl_data_quality_score < 0.95
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "NFL data quality degraded"
          description: "NFL data quality score is {{ $value }}, below the 95% threshold"

  - name: nfl-platform-network
    rules:
      # Network and HTTP alerts
      - alert: HighHTTPErrorRate
        expr: (rate(nginx_http_requests_total{status=~"5.."}[5m]) / rate(nginx_http_requests_total[5m])) * 100 > 5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP error rate"
          description: "HTTP error rate is above 5% for more than 10 minutes"

      - alert: HTTPResponseTimeSlow
        expr: nginx_http_request_duration_seconds{quantile="0.95"} > 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Slow HTTP response time"
          description: "95th percentile HTTP response time is above 2 seconds"

      - alert: SSLCertificateExpiring
        expr: probe_ssl_earliest_cert_expiry - time() < 30 * 24 * 3600  # 30 days
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "SSL certificate expiring soon"
          description: "SSL certificate for {{ $labels.instance }} expires in less than 30 days"